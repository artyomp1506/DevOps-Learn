# Application
server.port=8090

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/New3
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:666}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.access-secret=${JWT_ACCESS_SECRET:super-static-secret-string-42-foo-bar}
jwt.refresh-secret=${JWT_REFRESH_SECRET:super-static-secret-string-42-foo-bar}
jwt.access-token-expiration-time=86400
jwt.refresh-token-expiration-time=2629800000

# Redis
redis.hostname=${REDIS_HOSTNAME:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}

# Cloudflare
cf.zone_id=${CF_ZONE_ID:a161a5f2ea5c3f149342c95cb51de234}
cf.token=${CF_TOKEN:}

# Yandex Cloud
cloud.subnet_id=${YC_SUBNET_ID:enpsf4v5p43f4ek4f88d}
cloud.folder_id=${YC_FOLDER_ID:b1g4hasb5oc26qr7u1o5}

# SSH
ssh.key.path=${SSH_KEY_PATH:null}
ssh.username=${SSH_USERNAME:checker}
ssh.port=${SSH_PORT:22}

# VM IP (for checking)
vm.check.ip=${VM_CHECK_IP:localhost}